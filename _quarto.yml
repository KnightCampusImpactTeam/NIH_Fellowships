project:
  type: website
  output-dir: _site

website:
  title: "Science Communication for Bioengineers"
  description: "Course materials and workshops on scientific communication for bioengineering PhD students and postdocs"
  navbar:
    title: "Science Communication"
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: schedule.qmd
        text: Schedule
      - href: materials.qmd
        text: Materials
      - href: resources.qmd
        text: Resources
    right:
      - icon: github
        href: https://github.com/  # replace with your repo URL
        aria-label: GitHub repo

  page-footer:
    left: "Built with [Quarto](https://quarto.org)"
    right: "[Science Communication 2026]{.footer-badge}"

format:
  html:
    theme:
      - flatly
      - custom.scss
    include-in-header: header.html
    toc: true
    toc-depth: 2
    number-sections: false
    smooth-scroll: true
    link-external-newwindow: true
