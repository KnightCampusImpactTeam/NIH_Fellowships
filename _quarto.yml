project:
  type: website
  output-dir: _site

website:
  title: "NIH Fellowship Prep"
  description: "Course materials and workshops on NIH Fellowship for bioengineering PhD students and postdocs"
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: schedule.qmd
        text: Schedule
      - href: materials.qmd
        text: Materials
      - href: resources.qmd
        text: Resources
    right:
      - icon: github
        href: https://github.com/  # replace with your repo URL once created
        aria-label: GitHub repo

  page-footer:
    center: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 2
    number-sections: false
    smooth-scroll: true
    link-external-newwindow: true
